[package]
name = "soft_delete_example"
version = "0.1.0"
edition = "2021"

[dependencies]
billing = { path = "../../crates/billing" }
test-data = { path = "../../crates/test-data" }
# `graphql` exposes the guarded fetcher/creator accessors that soft delete is enforced through.
this-rs = { workspace = true, features = ["graphql"] }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
axum = "0.8"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
serde_json = "1"
