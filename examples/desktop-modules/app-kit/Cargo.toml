[package]
name = "app-kit"
version = "0.1.0"
edition = "2021"
publish = false
description = "Contrats purs d'une app this-rs : séquence de démarrage (splash), réglages persistés, politique d'accès. Aucun DOM, aucun Tauri, aucun HTTP."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
