[package]
name = "shop-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Domaine de la boutique (module this-rs) sans aucune dépendance de plateforme : consommé par le shell Tauri et par le serveur HTTP"

[dependencies]
# Framework : même source unique que les autres exemples (`[workspace.dependencies]`).
this-rs = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
this-app = { path = "../../../../this/crates/this-app" }
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
