services:
  neo4j:
    image: neo4j:5
    environment:
      # Local-development default only; set NEO4J_PASSWORD to override it
      # and export the same value when running the example.
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-billing123}
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:
