name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '**/*.mmd'
  # Lets a run be started on any branch by hand:
  #   gh workflow run ci.yml --ref <branch>
  # Useful when a push does not produce a run (observed on 2026-10-31) or when
  # a branch must be re-proven without a new commit.
  workflow_dispatch:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Documentation-only changes ─────────────────────────────────────────────
  # Every other job needs `code == 'true'`. `paths-ignore` used to live on
  # `pull_request` too: a docs-only PR then had NO check at all, and a required
  # status check that never reports blocks the merge forever. Computing it here
  # instead keeps a docs-only PR at a few seconds and gives the required
  # `CI gate` check something to report on every single PR.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Did anything other than documentation change?
        id: filter
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "no base commit to diff against: assume code changed"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" "$GITHUB_SHA" || true)
          echo "changed files:"; printf '%s\n' "$changed"
          code=$(printf '%s\n' "$changed" | grep -vE '(\.md$|\.mmd$|^docs/)' | grep -c . || true)
          echo "code files: $code"
          if [ "$code" -gt 0 ]; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi

  # ── Formatting ─────────────────────────────────────────────────────
  fmt:
    # Skipped when the change is documentation-only (see `changes`).
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout this-rs/this and prepare its local-only deps
        uses: ./.github/actions/this-dep

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  # ── Linting ────────────────────────────────────────────────────────
  clippy:
    # Skipped when the change is documentation-only (see `changes`).
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout this-rs/this and prepare its local-only deps
        uses: ./.github/actions/this-dep

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-clippy-

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  # ── Build each example individually ────────────────────────────────
  build-examples:
    # Skipped when the change is documentation-only (see `changes`).
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Build Examples
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout this-rs/this and prepare its local-only deps
        uses: ./.github/actions/this-dep

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-build-

      - name: Build rest_example
        run: cargo build -p rest_example

      - name: Build graphql_example
        run: cargo build -p graphql_example

      - name: Build dynamodb_example
        run: cargo build -p dynamodb_example

      - name: Build websocket_example
        run: cargo build -p websocket_example

      - name: Build grpc_example
        run: cargo build -p grpc_example

      - name: Build multi_module_example
        run: cargo build -p multi_module_example

      - name: Build postgres_example
        run: cargo build -p postgres_example

      - name: Build mongodb_example
        run: cargo build -p mongodb_example

      - name: Build neo4j_example
        run: cargo build -p neo4j_example

      - name: Build scylladb_example
        run: cargo build -p scylladb_example

      - name: Build mysql_example
        run: cargo build -p mysql_example

      - name: Build lmdb_example
        run: cargo build -p lmdb_example

      - name: Build event_flows_example
        run: cargo build -p event_flows_example

      - name: Build auth_sts_example
        run: cargo build -p auth_sts_example

      - name: Build oidc_example
        run: cargo build -p oidc_example

      - name: Build soft_delete_example
        run: cargo build -p soft_delete_example

      - name: Build cognitive_signals_example
        run: cargo build -p cognitive_signals_example

      - name: Build descriptor_example (REST + GraphQL + gRPC)
        run: cargo build -p descriptor_example

      - name: Build module_signing_example (module-signing feature)
        run: cargo build -p module_signing_example

      - name: Build vfs_module_example (ModuleStore over a Vfs)
        run: cargo build -p vfs_module_example

  # ── Code coverage ─────────────────────────────────────────────────
  coverage:
    # Skipped when the change is documentation-only (see `changes`).
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout this-rs/this and prepare its local-only deps
        uses: ./.github/actions/this-dep

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-coverage-

      - name: Generate code coverage
        run: |
          cargo llvm-cov --workspace --lcov --output-path lcov.info
          cargo llvm-cov -p billing --features lmdb --lcov --output-path lcov.lmdb.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info,lcov.lmdb.info
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ── Tests ──────────────────────────────────────────────────────────
  test:
    # Skipped when the change is documentation-only (see `changes`).
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout this-rs/this and prepare its local-only deps
        uses: ./.github/actions/this-dep

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-

      - name: Run tests
        run: cargo test --workspace --verbose

      # Named on purpose: this is the regression proof for the framework release
      # (v0.0.10). `cargo test --workspace` above already runs it, but a proof
      # that is not named in the CI log is a proof nobody reads.
      - name: Test descriptor_example — one declaration, three protocols
        run: cargo test -p descriptor_example --verbose

  # ── Smoke tests ──────────────────────────────────────────────────
  smoke:
    # Skipped when the change is documentation-only (see `changes`).
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout this-rs/this and prepare its local-only deps
        uses: ./.github/actions/this-dep

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-smoke-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-smoke-

      - name: Smoke — rest
        run: cargo test -p rest_example --test smoke

      - name: Smoke — graphql
        run: cargo test -p graphql_example --features graphql --test smoke

      - name: Smoke — grpc
        run: cargo test -p grpc_example --test smoke

      - name: Smoke — websocket
        run: cargo test -p websocket_example --test smoke

      - name: Smoke — multi-module
        run: cargo test -p multi_module_example --test smoke

      - name: Smoke — event-flows
        run: cargo test -p event_flows_example --test smoke

      - name: Smoke — auth-sts
        run: cargo test -p auth_sts_example --test smoke

      - name: Smoke — cognitive-signals
        run: cargo test -p cognitive_signals_example --test smoke

      - name: Smoke — postgres (testcontainers)
        run: cargo test -p postgres_example --test smoke -- --ignored --test-threads=1

      - name: Contract — soft delete on postgres (testcontainers)
        run: cargo test -p postgres_example --test soft_delete -- --ignored --test-threads=1

      - name: Smoke — mysql (testcontainers)
        run: cargo test -p mysql_example --test smoke -- --ignored --test-threads=1

      - name: Contract — soft delete on mysql (testcontainers)
        run: cargo test -p mysql_example --test soft_delete -- --ignored --test-threads=1

      - name: Smoke — mongodb (testcontainers)
        run: cargo test -p mongodb_example --test smoke -- --ignored --test-threads=1

      - name: Contract — soft delete on mongodb (testcontainers)
        run: cargo test -p mongodb_example --test soft_delete -- --ignored --test-threads=1

      - name: Smoke — neo4j (testcontainers)
        run: cargo test -p neo4j_example --test smoke -- --ignored --test-threads=1

      - name: Contract — soft delete on neo4j (testcontainers)
        run: cargo test -p neo4j_example --test soft_delete -- --ignored --test-threads=1

      # --ignored on purpose: the test is `#[ignore]`d so `cargo test --workspace`
      # does not pay for a Cassandra container in four other jobs.
      #
      # OPT-IN, and the honest reason why: measured on 2026-10-31, this step ran
      # 15m50 and still failed with 'CQL not ready' — a Cassandra node on a shared
      # runner does not reliably reach CQL readiness within any budget this job can
      # afford, even with a 300 s startup timeout and 180 readiness probes. The test
      # stays in the repository (run it locally with `-- --ignored`); turn this step
      # back on with the repository variable RUN_SLOW_CONTAINER_TESTS=true.
      # Leaving it unconditionally on would mean a red job every run for a reason
      # nobody reads any more.
      - name: Smoke — scylladb (testcontainers, slow, opt-in)
        if: ${{ vars.RUN_SLOW_CONTAINER_TESTS == 'true' }}
        run: cargo test -p scylladb_example --test smoke -- --ignored --test-threads=1
        timeout-minutes: 25

      - name: Contract — soft delete on scylladb (testcontainers, slow, opt-in)
        if: ${{ vars.RUN_SLOW_CONTAINER_TESTS == 'true' }}
        run: cargo test -p scylladb_example --test soft_delete -- --ignored --test-threads=1
        timeout-minutes: 25

      - name: Smoke — dynamodb (testcontainers)
        run: cargo test -p dynamodb_example --test smoke -- --ignored --test-threads=1

      - name: Contract — soft delete on dynamodb (testcontainers)
        run: cargo test -p dynamodb_example --test soft_delete -- --ignored --test-threads=1

  # ── Cross-platform ─────────────────────────────────────────────────
  cross-platform:
    # Skipped when the change is documentation-only (see `changes`).
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout this-rs/this and prepare its local-only deps
        uses: ./.github/actions/this-dep

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-cross-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-cross-

      - name: Build workspace
        run: cargo build --workspace

      - name: Run tests
        run: cargo test --workspace

  # ── The one check a branch protection rule should require ──────────────────
  # `if: always()` makes it report even when a dependency failed, which is the
  # whole point: a red CI must be able to block a merge. A skipped job counts as
  # fine here, and that is honest — a docs-only PR genuinely had nothing to check.
  gate:
    name: CI gate
    if: always()
    needs: [changes, fmt, clippy, build-examples, coverage, test, smoke, cross-platform]
    runs-on: ubuntu-latest
    steps:
      - name: Nothing failed, nothing was cancelled
        run: |
          results="${{ join(needs.*.result, ',') }}"
          echo "job results: $results"
          case ",$results," in
            *,failure,*|*,cancelled,*)
              echo "::error::at least one CI job failed or was cancelled"
              exit 1
              ;;
          esac
          echo "all jobs passed, or were skipped by design (documentation-only change)"

