[package]
name = "desktop_modules"
version = "0.1.0"
edition = "2021"
publish = false
description = "Adaptateur desktop (Tauri 2) : expose le domaine shop-core à un front Leptos, sans logique métier"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Coquille de plateforme : elle n'appartient pas au workspace portable de `this-examples`
# (sur Linux, Tauri exige GTK/WebKit). Elle a donc son propre workspace.
[workspace]

[lib]
# Tauri mobile construit la cible lib pour iOS/Android ; le binaire desktop reste `main.rs`.
name = "desktop_modules_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# Coquille Tauri de la plateforme : fenêtre, Dock, habillage, reprise (crate du framework).
this-shell-tauri = { package = "tauri-plugin-this-shell", path = "../../../../this/crates/this-shell-tauri" }
# Le domaine, partagé avec l'adaptateur HTTP et testé sans Tauri.
shop-core = { path = "../shop-core" }
# Le modèle de l'habillage (barre de titre, découpe) : la coquille le remplit, le front le lit.
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "ios")'.dependencies]
# `uname` : l'identifiant machine distingue Dynamic Island, encoche et écran entier.
# Régler la vue de défilement de la WKWebView (marges de sécurité appliquées une seule fois).

# Pour que la fenêtre inactive reçoive les mouvements de souris (voir src/lib.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
