# Backends (dynamodb, postgres, mysql, mongodb, neo4j, scylladb, lmdb) are exercised only by
# container-backed smoke tests (`#[ignore]`, run in the Smoke CI job), which `llvm-cov` does not
# execute. A handful of lines (e.g. billing/src/stores.rs LMDB setup) are therefore never covered
# by the coverage job. The PROJECT status stays the real gate; the PATCH status is informational so
# backend fixes are not blocked by lines that can only be covered by containers.
coverage:
  status:
    project:
      default:
        informational: false
    patch:
      default:
        informational: true
