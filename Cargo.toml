[workspace]
members = [
  "crates/billing",
  "crates/catalog",
  "crates/inventory",
  "crates/shipping",
  "crates/module-runtime",
  "crates/test-data",
  "examples/rest",
  "examples/graphql",
  "examples/dynamodb",
  "examples/postgres",
  "examples/mongodb",
  "examples/neo4j",
  "examples/scylladb",
  "examples/mysql",
  "examples/lmdb",
  "examples/websocket",
  "examples/grpc",
  "examples/event-flows",
  "examples/multi-module",
  "examples/auth-sts",
  "examples/oidc",
  "examples/soft-delete",
  "examples/cognitive-signals",
  "examples/descriptor",
  "examples/module-signing",
  "examples/vfs-module",
  "examples/desktop-modules/shop-core",
  "examples/desktop-modules/app-kit",
  "examples/desktop-modules/server",
  "benches/endpoint-benchmarks",
]
# La coquille Tauri n'est **pas** un membre : c'est un binaire de plateforme, et sur Linux
# il exige GTK/WebKit (`glib-2.0.pc`), ce qui ferait échouer `cargo build --workspace` en CI
# pour tout le dépôt. Elle se construit depuis son répertoire, comme `ui` et `ui-shell`.
exclude = ["examples/desktop-modules/src-tauri"]
resolver = "2"

# Single source of truth for the framework: a PATH dependency, deliberately
# with no version requirement.
#
# Why not the previous form (`[patch.crates-io] this-rs = { path = "../this" }`
# plus `version = "0.0.9"` in every member): a `[patch]` only applies when the
# version found at the path satisfies the requirement, and for 0.x ranges that
# is an exact match (^0.0.9 means >=0.0.9, <0.0.10). The day `this` moved to
# 0.0.10 the patch was silently ignored, cargo fell back to crates.io 0.0.9, and
# every member failed to resolve — `auth_sts_example` asks for the `wami`
# feature, which 0.0.9 does not have, so the error surfaced as a version
# selection failure rather than as "your patch is ignored".
#
# A path dependency carries no version, so no future bump can reintroduce it.
# Members pull it with `this-rs = { workspace = true, features = [...] }`.
[workspace.dependencies]
this-rs = { path = "../this" }
this-descriptor = { path = "../this/crates/this-descriptor" }
