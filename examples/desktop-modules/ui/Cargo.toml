[package]
name = "desktop_modules_ui"
version = "0.1.0"
edition = "2021"
publish = false

# Crate wasm autonome : pas membre du workspace hôte (cible wasm32, bundlée par trunk).
[workspace]

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
this-app = { path = "../../../../this/crates/this-app" }
this-descriptor = { path = "../../../../this/crates/this-descriptor" }
this-module-lang = { path = "../../../../this/crates/this-module-lang", features = ["assemble"] }
# Le harness : compiler, ranger dans un VFS, relire, exécuter. Le panneau ne fait
# plus que saisir et afficher — la logique vit dans ces crates.
this-module-harness = { path = "../../../../this/crates/this-module-harness" }
this-module-harness-web = { path = "../../../../this/crates/this-module-harness-web" }
this-vfs = { path = "../../../../this/crates/this-vfs" }
this-vfs-web = { path = "../../../../this/crates/this-vfs-web" }
# Un panic dans le wasm est sinon MUET : la page se fige sans rien dire. Le hook
# le transforme en erreur de console, donc en quelque chose qu'on peut lire.
console_error_panic_hook = "0.1"
module-runtime = { path = "../../../crates/module-runtime" }
this-ui = { path = "../../../../this/crates/this-ui" }
this-client-web = { path = "../../../../this/crates/this-client-web" }
gloo-net = { version = "0.6", features = ["http", "json"] }
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "Storage", "Navigator", "ReadableStream", "ReadableStreamDefaultReader"] }
