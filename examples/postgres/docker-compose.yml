services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: billing
      # Local-development default only; set POSTGRES_PASSWORD to override it
      # and use the same value in DATABASE_URL.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-billing}
      POSTGRES_DB: billing
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
