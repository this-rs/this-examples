[package]
name = "ui-shell"
version = "0.1.0"
edition = "2021"
publish = false
description = "Composants partagés d'une app this-rs en Leptos : splash de démarrage, panneau, réglages, application du thème"

# Crate wasm autonome (consommée par `ui/`), jamais compilée pour l'hôte.
[workspace]

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
app-kit = { path = "../app-kit" }
this-descriptor = { path = "../../../../this/crates/this-descriptor" }
serde_json = "1"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "Storage", "Navigator"] }
