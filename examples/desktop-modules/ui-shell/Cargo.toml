[package]
name = "ui-shell"
version = "0.1.0"
edition = "2021"
publish = false
description = "Composants partagés d'une app this-rs en Leptos : splash de démarrage, panneau, réglages, application du thème"

# Crate wasm autonome (consommée par `ui/`), jamais compilée pour l'hôte.
[workspace]

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
this-app = { path = "../../../../this/crates/this-app" }
this-descriptor = { path = "../../../../this/crates/this-descriptor" }
# Les décisions de plateforme (reprise, habillage) : le contrat du framework, pas une copie.
this-platform = { path = "../../../../this/crates/this-platform" }
serde_json = "1"
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["EventTarget", "Event", "Window", "Document", "Element", "HtmlElement", "CssStyleDeclaration", "NodeList", "EventTarget", "MediaQueryList", "Screen", "Storage", "Navigator", "DomRect"] }
