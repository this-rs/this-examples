services:
  mysql:
    image: mysql:8
    environment:
      # Local-development defaults only; override with the environment variables
      # and use the same MYSQL_PASSWORD value in DATABASE_URL.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: billing
      MYSQL_USER: billing
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-billing}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
